version: '3.8'
services:
  api:
    build: ./api
    container_name: devops-monitor-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: ./dashboard
    container_name: devops-monitor-dashboard
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
